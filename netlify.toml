# Netlify: build the static page, then serve /dist with long-lived caching for assets.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# Short, shareable redirects (handy for printed menus, stickers and bios)
[[redirects]]
  from = "/line"
  to = "https://lin.ee/HHEX6xq"
  status = 302

[[redirects]]
  from = "/review"
  to = "https://g.page/r/CZkdCHJ94FIbEBM/review"
  status = 302

[[redirects]]
  from = "/ig"
  to = "https://www.instagram.com/jackhigherbkk/"
  status = 302
